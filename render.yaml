# =============================================================================
# Render Blueprint for AutoStockManager
# =============================================================================
# One-click deployment of the full stack from this repo:
#   - PostgreSQL (managed database)
#   - Redis / Key Value (sessions, rate limiting, background job queue)
#   - Backend API (FastAPI, Docker) — runs migrations then uvicorn workers
#   - Worker (ARQ background jobs, Docker) — password-reset emails, etc.
#   - Frontend (Next.js, Docker)
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# See DEPLOYMENT.md for the full step-by-step guide.
#
# NOTE ON FREE TIER: free web services sleep after ~15 min of inactivity and
# take ~30s to wake on the next request. For steady business use, upgrade the
# `backend` and `frontend` services to the cheapest paid instance to disable
# sleeping. The database and key-value free tiers are fine to start.
# =============================================================================

databases:
  - name: autostockmanager-db
    databaseName: autostockmanager
    user: autostockmanager
    plan: free           # free Postgres (expires after 90 days on free tier — upgrade before then)
    postgresMajorVersion: "15"

services:
  # ---------------------------------------------------------------------------
  # Redis / Key Value store (sessions, rate limiting, ARQ job queue)
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: autostockmanager-redis
    plan: free
    ipAllowList: []       # only reachable from Render services on the private network
    maxmemoryPolicy: noeviction

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: autostockmanager-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Database — DATABASE_URL comes from the managed Postgres. The app expects
      # the asyncpg driver; async_database_url in config.py upgrades the scheme.
      - key: DATABASE_URL
        fromDatabase:
          name: autostockmanager-db
          property: connectionString
      # Redis connection string from the managed key-value service
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autostockmanager-redis
          property: connectionString
      # JWT secret — generated once by Render and kept stable across deploys
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Number of uvicorn workers (see backend/start.sh). 2 is a safe default
      # for a small instance; raise on larger plans.
      - key: WEB_CONCURRENCY
        value: "2"
      # CORS + cookie origin trust. Set to the frontend's public URL after the
      # first deploy (Render assigns the hostname). Because the UI and API are
      # on different render.com subdomains (different sites), the refresh cookie
      # must be SameSite=none + Secure.
      - key: CORS_ORIGINS
        sync: false        # set manually: https://autostockmanager-frontend.onrender.com
      - key: FRONTEND_BASE_URL
        sync: false        # set manually: https://autostockmanager-frontend.onrender.com
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      # SMTP for password-reset emails (required in production). Fill these in
      # the Render dashboard with your mail provider's credentials.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  # ---------------------------------------------------------------------------
  # Background worker (ARQ) — shares the backend image, different command
  # ---------------------------------------------------------------------------
  - type: worker
    name: autostockmanager-worker
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Override the image CMD: the worker never runs migrations or the web server
    dockerCommand: arq app.services.background_jobs.WorkerSettings
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autostockmanager-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autostockmanager-redis
          property: connectionString
      # Must match the backend's JWT secret so tokens issued by the API are
      # valid in any worker-side verification. Pull from the backend service.
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: autostockmanager-backend
          envVarKey: JWT_SECRET_KEY
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  # ---------------------------------------------------------------------------
  # Frontend (Next.js) — NEXT_PUBLIC_API_URL is baked in at build time, so it
  # is passed as a Docker build argument, not just a runtime env var.
  # ---------------------------------------------------------------------------
  - type: web
    name: autostockmanager-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Runtime copy (kept for parity; the value baked at build time is what
      # the browser bundle actually uses).
      - key: NEXT_PUBLIC_API_URL
        sync: false        # set manually: https://autostockmanager-backend.onrender.com/api/v1
